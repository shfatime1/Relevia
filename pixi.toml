[workspace]
name = "relevia"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.13"
nodejs = ">=22,<23"

# Keep the runtime constraints in sync with requirements.txt for deployment.
[pypi-dependencies]
Pillow = ">=10,<14"
pyarrow = ">=15,<27"
requests = ">=2.31,<3"
numpy = ">=1.26,<3"
rank-bm25 = "==0.2.2"
faiss-cpu = ">=1.9,<2"
sentence-transformers = ">=5,<7"
torch = ">=2.6"
transformers = ">=5,<6"
matplotlib = ">=3.8,<4"
scikit-learn = ">=1.4,<2"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
python-multipart = ">=0.0.9,<1"
httpx = ">=0.27,<1"
pytest = ">=8,<10"
pandas = ">=2.2, <4"
ipykernel = ">=6, <8"
nbclient = ">=0.10, <1"

[tasks]
backend = "python -m uvicorn backend.api:app --host 127.0.0.1 --port 8000"
frontend = { cmd = "npm run dev -- --port 5173 --strictPort", cwd = "frontend" }
setup-frontend = { cmd = "npm ci", cwd = "frontend" }
main = "node frontend/node_modules/concurrently/dist/bin/index.js --kill-others --names backend,frontend \"pixi run backend\" \"pixi run frontend\""
